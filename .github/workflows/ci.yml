name: Grocery Store CI

on:
  push:
    branches:
      - devops/docker
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/grocery_store_test
      JWT_SECRET: test-secret-for-ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check MongoDB connection
        run: |
          node -e "
            const mongoose = require('mongoose');

            mongoose.connect(process.env.TEST_MONGODB_URI, {
              serverSelectionTimeoutMS: 5000
            })
            .then(async () => {
              console.log('MongoDB connection successful');
              await mongoose.disconnect();
            })
            .catch(error => {
              console.error('MongoDB connection failed:', error.message);
              process.exit(1);
            });
          "

      - name: Run tests
        run: npm test
